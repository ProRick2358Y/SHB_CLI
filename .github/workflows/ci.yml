name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest playwright
          playwright install --with-deps
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Mandatory Checkpoint Files
        run: |
          test -f constitution.md
          test -f AGENTS_AND_SKILLS.md
          test -f ARCHITECTURE.md
          test -f PRD.md
          test -f TASK_BREAKDOWN.md
          test -f app.py

      - name: Run Code Quality Checks (Pre-commit)
        run: pre-commit run --all-files || true

      - name: Run Playwright E2E Tests
        run: pytest tests/test_ui.py

      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
